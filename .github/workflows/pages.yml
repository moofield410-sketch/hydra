# Builds hydra-site and publishes it to GitHub Pages. The site is hosted on Netlify (netlify.toml), so this
# only runs when started by hand from the Actions tab.
# VITE_SITE_URL (for the X link card) is the Pages address, or the repo variable SITE_URL when one is set.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: hydra-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hydra-site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hydra-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
